name: Build Test Deploy

# Deploy gates
#   DEV and PROD deploys only run when the matching GitHub Actions variable is exactly 'true':
#     DEPLOY_DEV_ENABLED   - merges of feature/* into develop deploy to services-dev
#     DEPLOY_PROD_ENABLED  - merges of develop into main deploy to services-prod
#   Set them per repository (Settings > Secrets and variables > Actions > Variables) or once for
#   the LegoHunter organization; a repository variable overrides the organization one.
#   Unset or any other value means the gate is shut: the environment's Maven build, Quay image
#   build/push and deploy jobs are all skipped (not failed), and a small "<ENV> deploy gate"
#   job adds a notice explaining why. SANDBOX is not gated.

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  feature-test:
    name: Feature branch tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven
      - name: Run Maven tests
        run: mvn --batch-mode test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sandbox-maven-build:
    name: Sandbox Maven deploy
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven
      - name: Build and deploy Maven snapshot
        run: mvn --batch-mode --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-app-jar
          path: target/*.jar

  sandbox-container-build:
    name: Sandbox container build and push
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/')
    needs: sandbox-maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-app-jar
          path: target
      - name: Buildah build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/lego-data-ingress
          tags: ${{ github.sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile
      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/lego-data-ingress
          tags: ${{ github.sha }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-sandbox:
    name: Deploy sandbox
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/')
    needs: sandbox-container-build
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Kustomize
        env:
          IMAGE_TAG: ${{ needs.sandbox-container-build.outputs.image-tag }}
        run: |
          set -euo pipefail
          kubectl kustomize kubernetes/overlays/sandbox \
            | sed "s|quay.io/tvattima/lego-data-ingress:.*|quay.io/tvattima/lego-data-ingress:$IMAGE_TAG|g" \
            | kubectl apply -n services-sandbox -f -
          kubectl rollout restart deployment lego-data-ingress -n services-sandbox
          kubectl rollout status deployment lego-data-ingress -n services-sandbox --timeout=5m

  dev-deploy-gate:
    name: DEV deploy gate
    # Runs only when the DEV gate is shut, to explain why the DEV jobs were skipped.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && vars.DEPLOY_DEV_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report shut gate
        run: |
          msg="DEV deploy gate is shut (DEPLOY_DEV_ENABLED is not 'true'). DEV Maven build, image build/push and deploy were skipped."
          echo "::notice title=DEV deploy skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  dev-maven-build:
    name: DEV Maven deploy
    # Gate: see the header comment.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && vars.DEPLOY_DEV_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven
      - name: Build and deploy Maven snapshot
        run: mvn --batch-mode --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-app-jar
          path: target/*.jar

  dev-container-build:
    name: DEV container build and push
    # Gate: see the header comment.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && vars.DEPLOY_DEV_ENABLED == 'true'
    needs: dev-maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: dev-app-jar
          path: target
      - name: Buildah build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/lego-data-ingress
          tags: ${{ github.event.pull_request.merge_commit_sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile
      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/lego-data-ingress
          tags: ${{ github.event.pull_request.merge_commit_sha }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-dev:
    name: Deploy DEV
    # Gate: see the header comment.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.head_ref, 'feature/') && vars.DEPLOY_DEV_ENABLED == 'true'
    needs: dev-container-build
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Deploy via Kustomize
        env:
          IMAGE_TAG: ${{ needs.dev-container-build.outputs.image-tag }}
        run: |
          set -euo pipefail
          kubectl kustomize kubernetes/overlays/dev \
            | sed "s|quay.io/tvattima/lego-data-ingress:.*|quay.io/tvattima/lego-data-ingress:$IMAGE_TAG|g" \
            | kubectl apply -n services-dev -f -
          kubectl rollout restart deployment lego-data-ingress -n services-dev
          kubectl rollout status deployment lego-data-ingress -n services-dev --timeout=5m

  prod-deploy-gate:
    name: PROD deploy gate
    # Runs only when the PROD gate is shut, to explain why the PROD jobs were skipped.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && vars.DEPLOY_PROD_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report shut gate
        run: |
          msg="PROD deploy gate is shut (DEPLOY_PROD_ENABLED is not 'true'). PROD Maven build, image build/push and deploy were skipped."
          echo "::notice title=PROD deploy skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  prod-maven-build:
    name: PROD Maven deploy
    # Gate: see the header comment.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && vars.DEPLOY_PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven
      - name: Build and deploy Maven snapshot
        run: mvn --batch-mode --update-snapshots deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-app-jar
          path: target/*.jar

  prod-container-build:
    name: PROD container build and push
    # Gate: see the header comment.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && vars.DEPLOY_PROD_ENABLED == 'true'
    needs: prod-maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: prod-app-jar
          path: target
      - name: Buildah build
        uses: redhat-actions/buildah-build@v2
        with:
          image: quay.io/tvattima/lego-data-ingress
          tags: ${{ github.event.pull_request.merge_commit_sha }}
          platforms: linux/arm64
          containerfiles: ./kubernetes/Containerfile
      - name: Push to Quay
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: quay.io
          image: tvattima/lego-data-ingress
          tags: ${{ github.event.pull_request.merge_commit_sha }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

  deploy-prod:
    name: Deploy PROD
    # Gate: see the header comment.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.head_ref == 'develop' && vars.DEPLOY_PROD_ENABLED == 'true'
    needs: prod-container-build
    runs-on: [arc-runner]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Deploy via Kustomize
        env:
          IMAGE_TAG: ${{ needs.prod-container-build.outputs.image-tag }}
        run: |
          set -euo pipefail
          kubectl kustomize kubernetes/overlays/prod \
            | sed "s|quay.io/tvattima/lego-data-ingress:.*|quay.io/tvattima/lego-data-ingress:$IMAGE_TAG|g" \
            | kubectl apply -n services-prod -f -
          kubectl rollout restart deployment lego-data-ingress -n services-prod
          kubectl rollout status deployment lego-data-ingress -n services-prod --timeout=5m
