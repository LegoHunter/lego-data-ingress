import-path: /etc/.credentials

spring:
  main:
    banner-mode: off

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,imageHostingReadiness

  tracing:
    sampling:
      probability: 1.0

kafka:
  properties:
    security.protocol: SASL_PLAINTEXT

lego:
  bricklink:
    pricing:
      crawl:
        scheduled:
          fixed-delay-ms: 180000
  image-hosting:
    sync:
      scheduled:
        enabled: true
        apply: true
        batch-size: 25
        concurrency: 2
        retry-failed: true
        fixed-delay-ms: 300000
        initial-delay-ms: 30000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
    readiness:
      require-scheduled-sync-enabled: true
