import-path: /dev/config

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    enabled: false
  defaults:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: INFO
    com.bricklink.api: DEBUG

lego:
  environment:
    code: local
  s3:
    url: https://api.silo.dev.internal.legohunter.io
  pricing:
    # Reprice (HOMELAB-66) in DRY_RUN with SANDBOX's guard: decisions only, never a sync request.
    reprice:
      enabled: true
      mode: DRY_RUN
      batch-size: 100
      scheduled:
        enabled: true
        initial-delay-ms: 5000
        fixed-delay-ms: 600000
      algorithm:
        maximum-absolute-change-per-run: 50.00  # matches guard.maximum-absolute-delta
      guard:
        minimum-delta:
          enabled: true
          percent: 0.02
        minimum-confidence: 0.75
        minimum-comparable-count: 3
        maximum-absolute-delta: 50.00
        maximum-percent-delta: 0.50
        blocked-reason-codes:
          - NO_CURRENT_COMPARABLES
          - NO_EXACT_COMPARABLES
          - NO_CURRENT_SNAPSHOT
  bricklink:
    orders:
      sync:
        scheduled:
          enabled: true
          apply: true
          fixed-delay-ms: 60000
          initial-delay-ms: 5000
    pricing:
      # local never crawls the real marketplace_pricing (HOMELAB-32): SANDBOX is the one crawler. To test
      # crawler changes, set lego.marketplace-pricing.schema=marketplace_pricing_scratch and enable the
      # crawl with a long scheduled.fixed-delay-ms, so it fetches a handful of items at most.
      crawl:
        enabled: false
        scheduled:
          enabled: false
    marketplace-sync:
      enabled: true
      mode: DRY_RUN
      # Same stockroom as SANDBOX (HOMELAB-20). local always runs marketplace sync as DRY_RUN.
      non-prod-stock-room-id: C
      scheduled:
        enabled: false
  fulfillment:
    sync:
      scheduled:
        enabled: true
        # Orders are PROD-only writes (HOMELAB-14). Non-prod maps orders in dry-run only;
        # FulfillmentSyncService also suppresses apply whenever lego.environment.production=false.
        apply: false
        fixed-delay-ms: 60000

kafka:
  bootstrap-servers: redpanda-dev-0.dev.internal.legohunter.io:31092,redpanda-dev-1.dev.internal.legohunter.io:31092,redpanda-dev-2.dev.internal.legohunter.io:31092

bricklink:
  rest:
    http-logging:
      enabled: true
      include-headers: false
      include-body: true
