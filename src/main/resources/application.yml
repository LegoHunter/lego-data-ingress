spring:
  profiles:
    default: sandbox,local
  application:
    name: Lego Data Ingress Service


lego:
  # Runtime environment identity, declared once per profile (bound by the lego-data starter).
  # Only application-prod.yml may set production=true. Non-production runtimes never write to
  # real orders (ShipStation, BrickLink order status, Drive Thru emails) because all environments
  # share one BrickLink/ShipStation account. At startup the lego-data starter refuses to run unless
  # the code matches the connected database (sandbox=lego_sandbox, dev=lego_dev, prod=lego_prod;
  # local=anything but lego_prod). Pricing apply and marketplace sync read these values below.
  environment:
    code: local
    production: false
  # The shared marketplace_pricing schema on the same MySQL server (HOMELAB-31/32).
  marketplace-pricing:
    schema: marketplace_pricing
  bricklink:
    pricing:
      # What this environment is pricing, kept in marketplace_pricing.want_list_item (HOMELAB-32). Every
      # environment that prices listings enables it; the shared crawler crawls the union of all want lists.
      want-list:
        enabled: false
        environment-code: ${lego.environment.code}
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        prune-after: 2d
        scheduled:
          enabled: false
          fixed-delay-ms: 3600000
          initial-delay-ms: 60000
          lock-at-most-for: 10m
          lock-at-least-for: 0s
      # The shared BrickLink crawler (HOMELAB-32). Exactly ONE deployment enables it (SANDBOX until PROD
      # exists); it crawls for every environment into marketplace_pricing. Never enable it anywhere else.
      crawl:
        enabled: false
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        active-listing-status-code: ACTIVE
        catalog-item-type: S
        batch-size: 25
        results-per-page: 500
        max-attempts: 3
        scheduled:
          enabled: false
          fixed-delay-ms: 300000
          initial-delay-ms: 30000
          lock-at-most-for: 30m
          lock-at-least-for: 0s
      decision:
        enabled: false
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        active-listing-status-code: ACTIVE
        batch-size: 25
        require-current-snapshot: false
        # Market-position formula. See the runbook section "Pricing formula and its levers".
        aggression: BALANCED                 # QUICK | BALANCED | PATIENT
        target-percentiles: {}               # overrides, e.g. "[U-C-BI]": 0.70 or "[N-S]": 0.25
        own-seller-names:                    # your BrickLink store username(s); their lots are never competitors
          - tvattima
        outlier-max-ratio-to-median: 3.0
        two-comparables-fraction: 0.25
        maximum-change-per-run: 0.25
        maximum-absolute-change-per-run:      # e.g. 50.00; keep <= apply-readiness maximum-absolute-delta
        box-instructions-adjustment-enabled: true
        step-down:                           # lower an unsold active listing's price weekly
          enabled: false
          start-after-weeks: 8                # full market price for the first 8 weeks
          weekly-percent: 0.01                # then 1% lower per further week unsold
          maximum-total-percent: 0.20         # never more than 20% below the market price
          floor-percentile: 0.10              # never below the 10th percentile of competing lots
        minimum-price:
        maximum-price:
        scheduled:
          enabled: false
          fixed-delay-ms: 300000
          initial-delay-ms: 30000
          lock-at-most-for: 10m
          lock-at-least-for: 0s
      apply-readiness:
        enabled: false
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        active-listing-status-code: ACTIVE
        proposed-decision-status-code: PROPOSED
        batch-size: 25
        minimum-price-delta: 0.01
        minimum-delta:
          enabled: false
          percent: 0.02
        minimum-confidence: 0.00
        minimum-comparable-count: 1
        maximum-absolute-delta:
        maximum-percent-delta:
        blocked-reason-codes: []
        apply-eligible-reason-codes:
          - MARKET_POSITION
          - SINGLE_COMPARABLE_DISCOUNTED
          - TWO_COMPARABLES_WEIGHTED
          - BELOW_MIN_PRICE_CLAMPED
          - ABOVE_MAX_PRICE_CLAMPED
        scheduled:
          enabled: false
          fixed-delay-ms: 300000
          initial-delay-ms: 30000
          lock-at-most-for: 10m
          lock-at-least-for: 0s
      apply:
        enabled: false
        bricklink-external-service-id: 2
        batch-size: 25
        sync-request-max-attempts: 3
        mode: DRY_RUN
        environment-code: ${lego.environment.code}
        scheduled:
          enabled: false
          fixed-delay-ms: 300000
          initial-delay-ms: 30000
          lock-at-most-for: 10m
          lock-at-least-for: 0s
    marketplace-sync:
      enabled: false
      mode: DRY_RUN
      bricklink-external-service-id: 2
      batch-size: 5
      retry-backoff: 6h
      environment-code: ${lego.environment.code}
      production: ${lego.environment.production}
      require-system-remarks-block: true
      non-prod-require-stock-room: true
      # HOMELAB-20: no code default. local/SANDBOX=C, DEV=B; A is reserved for PROD (startup check).
      non-prod-stock-room-id: C
      remarks-max-length: 1024
      scheduled:
        enabled: false
        fixed-delay-ms: 300000
        initial-delay-ms: 30000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
    # Read-only comparison of the BrickLink store with the local listings (drift report + metrics).
    inventory-reconciliation:
      enabled: false
      bricklink-external-service-id: 2
      scheduled:
        enabled: false
        fixed-delay-ms: 3600000
        initial-delay-ms: 120000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
    # Read-only audit: no lower-environment lot may be public or outside its own stockroom. Has its
    # own switch so turning marketplace sync or the Pricing Plane off does not turn it off.
    lot-audit:
      enabled: false
      scheduled:
        enabled: false
        fixed-delay-ms: 1800000
        initial-delay-ms: 60000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
    orders:
      sync:
        marketplace-code: BRICKLINK
        metrics-tag: bricklink
        direction: in
        statuses:
          - PENDING
          - UPDATED
          - READY
          - PROCESSING
          - PAID
          - PACKED
        include-unfiled-cancelled: true
        scheduled:
          enabled: false
          apply: false
          fixed-delay-ms: 3600000
          initial-delay-ms: 30000
          lock-at-most-for: 10m
          lock-at-least-for: 0s
  image-hosting:
    default-provider: flickr
    providers:
      flickr:
        enabled: true
        external-service-id: 10
        display-name: Flickr
        metrics-tag: flickr
    publishing:
      photo:
        title-template: "{captionOrFilename}"
        description-template: "{captionOrTitle}"
        tags: []
        public-flag: true
        friend-flag: false
        family-flag: false
        hidden: false
        safety-level: safe
    sync:
      external-service-id: 10
      retry:
        enabled: true
        max-attempts: 3
        initial-backoff-ms: 500
        backoff-multiplier: 2.0
        max-backoff-ms: 5000
      scheduled:
        enabled: false
        batch-size: 25
        concurrency: 5
        retry-failed: true
        apply: false
        fixed-delay-ms: 300000
        initial-delay-ms: 30000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
    readiness:
      enabled: true
      require-scheduled-sync-enabled: false
      require-bitly-when-apply-enabled: true
  fulfillment:
    marketplace-code: BRICKLINK
    metrics-tag: fulfillment
    statuses:
      - PENDING
      - UPDATED
      - READY
      - PROCESSING
      - PAID
      - PACKED
    sync:
      scheduled:
        enabled: false
        apply: false
        batch-size: 25
        fixed-delay-ms: 3600000
        initial-delay-ms: 30000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
    shipstation:
      order-number-prefix: BL-
      domestic-country-code: US
      carrier-code: stamps_com
      domestic-service-code: usps_priority_mail
      international-service-code: usps_priority_mail_international
      package-code: package
      insurance-provider: shipsurance
      international-contents: merchandise
      international-non-delivery: return_to_sender
      customs-country-of-origin: US
      order-item-image-external-service-id: 10

kafka:
  bootstrap-servers: redpanda-dev-0.dev.internal.legohunter.io:31092,redpanda-dev-1.dev.internal.legohunter.io:31092,redpanda-dev-2.dev.internal.legohunter.io:31092
  properties:
    security.protocol: SASL_SSL
    sasl.mechanism: SCRAM-SHA-512

bricklink:
  ajax:
    uri: https://www.bricklink.com
    rate-limit:
      enabled: true
      minimum-delay-ms: 2000
    http-logging:
      enabled: false
  rest:
    uri: https://api.bricklink.com/api/store/v1
# set timeouts for the Bricklink REST API (defaults: connect 10s, read 60s; uncomment to override)
#    timeouts:
#      connect: 10s
#      read: 60s
    http-logging:
      enabled: true
      include-headers: true
      include-body: true
      max-body-length: -1
