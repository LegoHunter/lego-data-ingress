spring:
  config:
    import:
      - file:${import-path}/database-configuration.yml
      - file:${import-path}/kafka-configuration.yml
      - file:${import-path}/s3-configuration.yml
      - file:${import-path}/flickr-configuration.yml
      - file:${import-path}/bitly-configuration.yml
      - file:${import-path}/bricklink-client-api-keys.yml
      # ShipStation is PROD-only (HOMELAB-57/59): lower environments hold no ShipStation credentials,
      # so the file is optional here and the fulfillment sync below is off.
      - optional:file:${import-path}/shipstation-configuration.yml
  # The shipstation-rest starter fails at startup without credentials (by design, which keeps PROD
  # safe), so lower environments switch it off entirely (HOMELAB-57).
  autoconfigure:
    exclude: com.shipstation.api.rest.autoconfigure.ShipStationRestAutoConfiguration
  datasource:
    database-key-name: rasppi5-01-lego-dev
    hikari:
      # MySQL on rasppi5-01 runs on Eastern time. Run every session in UTC so CURRENT_TIMESTAMP
      # defaults, NOW() and TIMESTAMP columns agree with the UTC values the application writes.
      connection-init-sql: "SET time_zone = '+00:00'"
      connection-timeout: 10000
      idle-timeout: 30000
      connection-test-query: SELECT 1
      initialization-fail-timeout: 10000
      auto-commit: false
      login-timeout: 10000
      minimum-idle: 10
      maximum-pool-size: 40
      validation-timeout: 10000
      pool-name: rasppi5-01-mysql-jdbc-pool

lego:
  environment:
    code: dev
  s3:
    # silo-dev serves SANDBOX and DEV (HOMELAB-54); each environment has its own S3 user and buckets.
    url: http://silo-dev.silo-dev.svc.cluster.local:9000
    buckets:
      final-photo: lego-photos-dev
  pricing:
    # The Reprice job (HOMELAB-65), in DRY_RUN as in SANDBOX: it writes PROPOSED/BLOCKED decisions only,
    # with no sync requests and no BrickLink calls. DEV never ran the decision, apply-readiness or apply
    # jobs it replaces; they stay off below, and the application refuses to start with Reprice and any of
    # them on. Reprice reads the formula and guard settings in lego.bricklink.pricing.decision and
    # apply-readiness, which match SANDBOX's so the two environments decide alike.
    reprice:
      enabled: true
      mode: DRY_RUN
      batch-size: 25
      immediate-sync-limit: 5
      sync-request-max-attempts: 3
      scheduled:
        enabled: true
        fixed-delay-ms: 600000
        initial-delay-ms: 120000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
  bricklink:
    orders:
      sync:
        scheduled:
          enabled: true
          apply: true
          fixed-delay-ms: 300000
    pricing:
      # DEV tells the shared crawler what it sells; it never crawls BrickLink itself (HOMELAB-32).
      want-list:
        enabled: true
        scheduled:
          enabled: true
      crawl:
        enabled: false
      # Off: Reprice replaces these jobs. Their settings are what Reprice decides and guards with (the
      # defaults in application.yml are far looser), so keep them in step with application-sandbox.yml.
      decision:
        enabled: false
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        active-listing-status-code: ACTIVE
        batch-size: 100
        maximum-absolute-change-per-run: 50.00  # matches apply-readiness maximum-absolute-delta
        require-current-snapshot: true
        scheduled:
          enabled: false
      apply-readiness:
        enabled: false
        bricklink-external-service-id: 2
        priceable-listing-status-codes:
          - ACTIVE
          - DRAFT
        active-listing-status-code: ACTIVE
        proposed-decision-status-code: PROPOSED
        batch-size: 100
        minimum-price-delta: 0.01
        minimum-delta:
          enabled: true
          percent: 0.02
        minimum-confidence: 0.75
        minimum-comparable-count: 3
        maximum-absolute-delta: 50.00
        maximum-percent-delta: 0.50
        blocked-reason-codes:
          - NO_CURRENT_COMPARABLES
          - NO_EXACT_COMPARABLES
          - NO_CURRENT_SNAPSHOT
        apply-eligible-reason-codes:
          - MARKET_POSITION
          - SINGLE_COMPARABLE_DISCOUNTED
          - TWO_COMPARABLES_WEIGHTED
          - BELOW_MIN_PRICE_CLAMPED
          - ABOVE_MAX_PRICE_CLAMPED
        scheduled:
          enabled: false
      apply:
        enabled: false
        scheduled:
          enabled: false
    marketplace-sync:
      enabled: true
      mode: APPLY
      bricklink-external-service-id: 2
      batch-size: 5
      retry-backoff: 6h
      require-system-remarks-block: true
      non-prod-require-stock-room: true
      # HOMELAB-20: DEV owns stockroom B. A is reserved for PROD, C for SANDBOX.
      non-prod-stock-room-id: B
      remarks-max-length: 1024
      scheduled:
        enabled: true
        fixed-delay-ms: 600000
        initial-delay-ms: 300000
        lock-at-most-for: 10m
        lock-at-least-for: 0s
  fulfillment:
    sync:
      scheduled:
        # ShipStation is PROD-only (HOMELAB-57/59): no ShipStation calls at all outside PROD, not even
        # the dry run. Without shipstation.rest.* the ShipStation client is not created either.
        # (Orders are PROD-only writes since HOMELAB-14; FulfillmentSyncService also suppresses apply
        # whenever lego.environment.production=false.)
        enabled: false
        apply: false
        fixed-delay-ms: 300000

kafka:
  bootstrap-servers: redpanda-dev-0.redpanda-dev.redpanda-dev.svc.cluster.local:9092,redpanda-dev-1.redpanda-dev.redpanda-dev.svc.cluster.local:9092,redpanda-dev-2.redpanda-dev.redpanda-dev.svc.cluster.local:9092
  properties:
    security.protocol: SASL_SSL
    sasl.mechanism: SCRAM-SHA-512
  consumer-defaults:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username='${lego.kafka.consumer.username}' password='${lego.kafka.consumer.password}';"
      spring.json.trusted.packages: "*"
      spring.json.use.type.headers: true
  producer-defaults:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    retries: 10
    properties:
      spring.json.trusted.packages: "*"
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username='${lego.kafka.producer.username}' password='${lego.kafka.producer.password}';"
      # Reduce noisy INFO logs from NetworkClient
      log.level.org.apache.kafka.clients.NetworkClient: WARN
      # Maximum time to wait for a request to complete
      request.timeout.ms: 60000
      # How long to wait for a broker connection before timing out
      max.block.ms: 60000
      # Enable idempotence to avoid duplicate messages on retries
      enable.idempotence: true
      # Backoff between retries
      retry.backoff.ms: 500
      # Reduce aggressive reconnect attempts on slow connections
      connections.max.idle.ms: 300000
      # Metadata refresh interval (longer interval reduces churn)
      metadata.max.age.ms: 300000
  topic-configuration:
    s3-events:
      topics: dev-s3-events
      consumer:
        group-id: dev-s3-events-group
        properties:
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      producer:
        retries: 3
    s3-event-routing:
      topics: dev-upload-photo, dev-delete-photo, dev-upload-bricklink-catalog, dev-upload-bricklink-category, dev-upload-rebrickable-catalog, dev-upload-rebrickable-theme
      producer:
        retries: 3
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    upload-photo:
      topic: dev-upload-photo
      consumer:
        group-id: dev-upload-photo-group
        concurrency: 1
        properties:
          max-poll-records: 1
          max-poll-interval-ms: 1800000
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    delete-photo:
      topic: dev-delete-photo
      consumer:
        group-id: dev-delete-photo-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectDeletedEvent
      producer:
        retries: 3
    upload-bricklink-catalog:
      topic: dev-upload-bricklink-catalog
      consumer:
        group-id: dev-upload-bricklink-catalog-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-bricklink-category:
      topic: dev-upload-bricklink-category
      consumer:
        group-id: dev-upload-bricklink-category-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-rebrickable-catalog:
      topic: dev-upload-rebrickable-catalog
      consumer:
        group-id: dev-upload-rebrickable-catalog-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    upload-rebrickable-theme:
      topic: dev-upload-rebrickable-theme
      consumer:
        group-id: dev-upload-rebrickable-theme-group
        properties:
          spring-json-value-default-type: io.legohunter.ingress.common.kafka.event.ObjectUploadedEvent
      producer:
        retries: 3
    photo-upload-entry:
      topic: dev-photo-upload-entry
      consumer:
        group-id: dev-photo-upload-entry-group
    bricklink-catalog-entry:
      topic: dev-bricklink-catalog-entry
      consumer:
        group-id: dev-bricklink-catalog-entry-group
      producer:
        retries: 3
    bricklink-category-entry:
      topic: dev-bricklink-category-entry
      consumer:
        group-id: dev-bricklink-category-entry-group
      producer:
        retries: 3
    rebrickable-catalog-entry:
      topic: dev-rebrickable-catalog-entry
      consumer:
        group-id: dev-rebrickable-catalog-entry-group
      producer:
        retries: 3
    rebrickable-theme-entry:
      topic: dev-rebrickable-theme-entry
      consumer:
        group-id: dev-rebrickable-theme-entry-group
      producer:
        retries: 3
