apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: services-prod

labels:
  - pairs:
      app.kubernetes.io/instance: prod
    # Also on the pod template: the base carries no environment (HOMELAB-26 E6).
    includeTemplates: true

resources:
  - ../../base

images:
  - name: quay.io/tvattima/lego-data-ingress
    newTag: snapshot

replicas:
  - name: lego-data-ingress
    count: 1

patches:
  - path: deployment-env-patch.yaml
  - path: deployment-resources-patch.yaml
  # services-prod-external-secret mount
  - path: deployment-prod-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: lego-data-ingress
  # PROD hostname and TLS certificate
  - path: ingress-patch.yaml
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: lego-data-ingress
